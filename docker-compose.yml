services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trustlist
      POSTGRES_PASSWORD: trustlist
      POSTGRES_DB: trustlist
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustlist -d trustlist"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
