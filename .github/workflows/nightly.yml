name: nightly

# Cold start rot is the most common way a working project fails in front of a
# judge, and it only shows up on a machine that has never seen the repo. So
# this runs on a schedule rather than on push, where the cache would hide it.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  coldstart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cold start from a clean container
        env:
          BSC_RPC_HTTP: https://bsc-rpc.publicnode.com
          # Lets the container download the prebuilt binaries published by
          # binaries.yml while this repository is private. A stranger needs
          # no token because a public repository serves assets anonymously.
          # See the note in scripts/coldstart_test.sh.
          GH_TOKEN: ${{ github.token }}
          # The 5 minute target in SPEC 30.1 assumes prebuilt artifacts. This
          # budget is what an uncached build needs when the download is not
          # available and the container has to compile, which is still the
          # fallback. The real elapsed time is printed either way.
          COLDSTART_BUDGET_SECS: "1500"
        run: bash scripts/coldstart_test.sh
      - name: Show the logs if it failed
        if: failure()
        run: tail -50 /tmp/api.log /tmp/web.log 2>/dev/null || true
