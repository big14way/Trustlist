name: nightly

# Cold start rot is the most common way a working project fails in front of a
# judge, and it only shows up on a machine that has never seen the repo. So
# this runs on a schedule rather than on push, where the cache would hide it.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  coldstart:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cold start from a clean container
        env:
          BSC_RPC_HTTP: https://bsc-rpc.publicnode.com
          # SPEC 30.2's own number, now that it is met: measured at 89s and
          # 150s with the prebuilt binaries in use, no credentials needed. A run that
          # cannot download them compiles instead and takes about 470s, and
          # failing this budget is the correct outcome in that case: it means
          # the five minute promise does not hold for that commit. The script
          # prints which path it took.
          COLDSTART_BUDGET_SECS: "300"
        run: bash scripts/coldstart_test.sh
      - name: Show the logs if it failed
        if: failure()
        run: tail -50 /tmp/api.log /tmp/web.log 2>/dev/null || true
