name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: trustlist
          POSTGRES_PASSWORD: trustlist
          POSTGRES_DB: trustlist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trustlist -d trustlist"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://trustlist:trustlist@localhost:5432/trustlist
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: cd web && npm ci
      - name: Start the api (runs migrations on boot)
        run: |
          set -a && source .env.example && set +a
          export DATABASE_URL=postgres://trustlist:trustlist@localhost:5432/trustlist
          cargo build --release -p api
          nohup cargo run --release -p api > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/v1/health >/dev/null && break; sleep 2
          done
          curl -sf http://localhost:8080/v1/health
      - name: Load the seed (real indexed rows, bounded sample)
        run: bash scripts/load_seed.sh
      # Without this the M6 snapshot checks in the gate had never run on a
      # push: CI had no snapshot and no chain, so both endpoints 404ed and
      # the root comparison was skipped. anvil plus one trust pass makes the
      # whole pipeline, build to publish to serve to verify, run every time.
      - name: Publish a snapshot on a local chain
        run: bash scripts/ci_snapshot.sh
      - name: Build and start the web app
        run: |
          cd web
          npm run build
          nohup npx next start > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3000/ && break; sleep 2
          done
          curl -sf -o /dev/null http://localhost:3000/
      # TRUST_SNAPSHOT and HIRE_RAIL_RPC come from the snapshot step through
      # GITHUB_ENV. verify.sh no longer sources the env files, so those
      # values survive instead of being blanked by the empty placeholders in
      # .env.example.
      - name: Run the gate
        run: bash scripts/verify.sh
